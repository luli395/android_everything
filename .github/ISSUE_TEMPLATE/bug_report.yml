name: Bug report
description: Report a reproducible problem in Android Everything
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Remove device serials, personal paths, and copied phone content before submitting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect a device...
        2. Click...
        3. Observe...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows, Python, ADB, and Android versions (without a device serial)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell

